services:
  novel-writing-tool:
    build: .
    container_name: novel-writing-tool
    ports:
      - "8001:8001"
    volumes:
      # Persist novel data outside the container
      - ./data:/app/data
      # Mount your settings with API key (create settings.local.json and rename)
      - ./settings.json:/app/settings.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sS", "http://127.0.0.1:8001/api/novels"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
